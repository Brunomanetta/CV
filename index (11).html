<style>
  :root{
    --bg: #F6F5F1;
    --panel: #FFFFFF;
    --ink: #1B1C19;
    --ink-soft: #55564F;
    --ink-faint: #8B8A80;
    --line: #DEDCD2;
    --accent: #3F4A63;
    --accent-soft: #EDEFF3;
    --tag: #A9622D;
    --tag-soft: #F3E8DD;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:#fff; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:0.02em; }
  .skip-link{ position:absolute; left:-999px; top:0; background:var(--ink); color:#fff; padding:10px 16px; z-index:200; }
  .skip-link:focus{ left:16px; top:16px; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:1px; }

  /* ---- language switcher ---- */
  .lang-switch{
    position:fixed; top:16px; right:16px; z-index:100;
    display:flex; gap:2px; background:var(--panel); border:1px solid var(--line);
    padding:3px; box-shadow:0 2px 10px rgba(27,28,25,0.06);
  }
  .lang-switch button{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.04em;
    padding:7px 12px; border:none; background:transparent; color:var(--ink-faint); cursor:pointer;
    transition: background .18s cubic-bezier(.4,0,.2,1), color .18s cubic-bezier(.4,0,.2,1);
  }
  .lang-switch button:hover:not(:disabled){ color:var(--ink); }
  .lang-switch button.active{ background:var(--ink); color:#fff; }
  .lang-switch button:disabled{ cursor:not-allowed; opacity:.45; }
  @media (max-width:860px){ .lang-switch{ top:10px; right:10px; } .lang-switch button{ padding:6px 9px; font-size:10px; } }
  @media print{ .lang-switch{ display:none; } }

  .shell{ display:grid; grid-template-columns: 260px 1fr; max-width:1180px; margin:0 auto; min-height:100vh; }
  @media (max-width: 860px){ .shell{ grid-template-columns: 1fr; } }

  .sidebar{
    border-right:1px solid var(--line); padding:48px 28px; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  @media (max-width: 860px){
    .sidebar{ position:sticky; top:0; z-index:20; height:auto; border-right:none; border-bottom:1px solid var(--line);
      background:var(--bg); padding:16px 20px; flex-direction:row; align-items:center; justify-content:space-between; gap:16px; }
    .sidebar > div:first-child{ display:flex; align-items:center; gap:20px; flex:1; min-width:0; }
    .brand-block{ display:none; }
    .status{ margin-top:0; white-space:nowrap; }
    .status span:last-child{ display:none; }
  }
  .brand{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.01em; }
  .brand-sub{ margin-top:6px; font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; }
  nav ul{ list-style:none; margin-top:56px; display:flex; flex-direction:column; gap:2px; }
  @media (max-width: 860px){
    nav ul{ margin-top:0; flex-direction:row; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    nav ul::-webkit-scrollbar{ display:none; }
    nav a{ white-space:nowrap; border-left:none !important; border-bottom:2px solid transparent; padding:6px 10px !important; }
    nav a.active, nav a:hover{ border-bottom-color:var(--tag); }
  }
  nav a{ font-size:13px; padding:9px 0; color:var(--ink-soft); border-left:2px solid transparent; padding-left:12px; display:block;
    transition: color .18s cubic-bezier(.4,0,.2,1), border-color .18s cubic-bezier(.4,0,.2,1); }
  nav a:hover, nav a:focus-visible{ color:var(--ink); border-left-color:var(--tag); }
  nav a.active{ color:var(--ink); border-left-color:var(--tag); }
  nav .idx{ color:var(--ink-faint); margin-right:8px; }
  .status{ margin-top:40px; font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:8px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:#4C7A54; flex:none; }

  main{ padding: 64px 56px 120px; }
  @media (max-width: 860px){ main{ padding: 40px 22px 80px; } }
  section{ margin-bottom:68px; scroll-margin-top:32px; }
  section:last-of-type{ margin-bottom:0; }

  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--tag); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:10px; }

  /* hero */
  .hero-card{ background:var(--panel); border:1px solid var(--line); overflow:hidden; }
  .hero-top{ padding:36px 40px 30px; border-bottom:1px dashed var(--line); }
  .hero-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(28px, 4.4vw, 46px); line-height:1.05; letter-spacing:-0.02em; }
  .hero-role{ margin-top:12px; font-size:16px; color:var(--ink-soft); max-width:640px; }
  @media (max-width:480px){ .hero-name{ font-size:30px; } }

  .hero-fields{ display:grid; grid-template-columns: repeat(4, 1fr); }
  @media (max-width:760px){ .hero-fields{ grid-template-columns:repeat(2,1fr); } }
  .field{ padding:20px 28px; border-right:1px dashed var(--line); }
  .field:last-child{ border-right:none; }
  @media (max-width:760px){ .field:nth-child(2n){ border-right:none; } .field{ border-bottom:1px dashed var(--line); } }
  .field-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-faint); margin-bottom:6px; }
  .field-value{ font-size:13.5px; }

  .lede{ max-width:660px; margin-top:28px; font-size:16px; color:var(--ink-soft); }

  .hero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
  .btn{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:11px 18px; border:1px solid var(--ink); transition: background .18s cubic-bezier(.4,0,.2,1), color .18s cubic-bezier(.4,0,.2,1); }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:var(--accent); border-color:var(--accent); }
  .btn-secondary{ background:transparent; color:var(--ink); }
  .btn-secondary:hover{ background:var(--ink); color:#fff; }

  h2{ font-family:'Space Grotesk',sans-serif; font-size:25px; font-weight:600; letter-spacing:-0.01em; margin-bottom:28px; }

  /* experience */
  .entry{ display:grid; grid-template-columns: 130px 1fr; gap:24px; padding:28px 0; border-top:1px solid var(--line); }
  .entry:last-child{ border-bottom:1px solid var(--line); }
  @media (max-width:640px){ .entry{ grid-template-columns:1fr; gap:8px; } }
  .entry-idx{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-faint); padding-top:2px; line-height:1.5; }
  .entry-title{ font-weight:600; font-size:16px; }
  .entry-meta{ font-size:12px; color:var(--ink-faint); margin-top:4px; font-family:'IBM Plex Mono',monospace; }
  .entry-context{ margin-top:10px; font-size:14px; color:var(--ink-soft); max-width:620px; }
  .entry-block-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin-top:14px; margin-bottom:6px; }
  .entry ul{ padding-left:18px; font-size:14px; color:var(--ink-soft); max-width:620px; }
  .entry ul li{ margin-bottom:6px; }
  .sub{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
  .sub-title{ font-size:14px; font-weight:600; }
  .sub-meta{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; margin-top:2px; }

  /* compact entries: brief/early roles get lighter visual weight */
  .entry-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; padding:22px 0 2px; }
  .entry-compact{ display:grid; grid-template-columns:130px 1fr; gap:24px; padding:14px 0; border-top:1px solid var(--line); align-items:baseline; }
  .entry-compact:last-child{ border-bottom:1px solid var(--line); }
  @media (max-width:640px){ .entry-compact{ grid-template-columns:1fr; gap:4px; } }
  .entry-compact .entry-idx{ font-size:11px; }
  .compact-head{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
  .compact-title{ font-weight:600; font-size:14px; }
  .compact-meta{ font-size:10.5px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  .compact-context{ margin-top:3px; font-size:13px; color:var(--ink-soft); max-width:600px; line-height:1.45; }

  /* highlights */
  .highlights-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
  @media (max-width:760px){ .highlights-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width:480px){ .highlights-grid{ grid-template-columns: 1fr; } }
  .highlight-item{ background:var(--panel); padding:22px 22px 20px; transition: background .2s cubic-bezier(.4,0,.2,1); }
  .highlight-item:hover{ background:var(--accent-soft); }
  .highlight-idx{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--tag); margin-bottom:10px; }
  .highlight-label{ font-weight:600; font-size:14.5px; line-height:1.3; }
  .highlight-text{ margin-top:6px; font-size:13px; color:var(--ink-soft); line-height:1.45; }

  /* projects: case-study format */
  .project-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  @media (max-width:760px){ .project-grid{ grid-template-columns:1fr; } }
  .project-card{ border:1px solid var(--line); background:var(--panel); padding:26px 28px; transition: border-color .2s cubic-bezier(.4,0,.2,1); }
  .project-card:hover{ border-color:var(--ink-faint); }
  .project-title{ font-weight:600; font-size:16px; margin-bottom:16px; }
  .case-block{ margin-top:14px; }
  .case-block:first-of-type{ margin-top:0; }
  .case-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--tag); margin-bottom:4px; font-family:'IBM Plex Mono',monospace; }
  .case-text{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
  .project-card.empty{ border-style:dashed; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink-faint); font-size:12px; font-family:'IBM Plex Mono',monospace; min-height:64px; padding:16px; transition:none; }
  .project-card.empty:hover{ border-color:var(--line); }

  /* skills */
  .skill-groups{ display:grid; grid-template-columns: repeat(3, 1fr); gap:32px; }
  @media (max-width:860px){ .skill-groups{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width:640px){ .skill-groups{ grid-template-columns:1fr; } }
  .skill-group-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); margin-bottom:12px; }
  .tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{ font-family:'IBM Plex Mono',monospace; font-size:12px; padding:7px 12px; background:var(--accent-soft); color:var(--accent); }
  .tag.alt{ background:var(--tag-soft); color:var(--tag); }

  /* languages */
  .lang-list{ display:flex; flex-direction:column; gap:14px; max-width:480px; }
  .lang-row-item{ display:flex; justify-content:space-between; align-items:baseline; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .lang-row-item:last-child{ border-bottom:none; padding-bottom:0; }
  .lang-name{ font-weight:600; font-size:14.5px; }
  .lang-level{ font-size:13px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }

  /* education */
  .edu-grid{ display:flex; flex-direction:column; max-width:640px; }
  .edu-item{ padding:14px 0; border-bottom:1px solid var(--line); }
  .edu-item:first-child{ padding-top:0; }
  .edu-item.priority .edu-title{ color:var(--accent); }
  .edu-title{ font-weight:600; font-size:14px; }
  .edu-meta{ font-size:12px; color:var(--ink-faint); margin-top:4px; font-family:'IBM Plex Mono',monospace; }

  /* interests */
  .interests-text{ font-size:14px; color:var(--ink-soft); max-width:660px; }
  .interests-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .interests-tags .tag{ background:var(--bg); border:1px solid var(--line); color:var(--ink-faint); }

  /* contact */
  .contact-card{ background:var(--ink); color:var(--bg); padding:44px 40px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px; }
  .contact-card h2{ color:#fff; margin-bottom:10px; }
  .contact-card p{ color:#B9B8AF; max-width:440px; font-size:14px; }
  .contact-links{ display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .contact-links a{ font-family:'IBM Plex Mono',monospace; font-size:13px; border-bottom:1px solid #4A4B44; padding-bottom:2px; transition: border-color .15s ease; }
  .contact-links a:hover{ border-color:var(--tag); }
  .domain-slot{ margin-top:28px; border:1px dashed #4A4B44; padding:14px 18px; font-size:11.5px; color:#8F8E86; font-family:'IBM Plex Mono',monospace; }

  footer{ margin-top:40px; font-size:11px; color:var(--ink-faint); text-align:center; }

  section{ opacity:0; transform:translateY(10px); transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1); }
  section.visible{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; } *{ transition:none !important; } section{ opacity:1; transform:none; }
  }

  @media print{
    .sidebar{ display:none; }
    .shell{ grid-template-columns:1fr; max-width:100%; }
    main{ padding:0 8px; }
    section{ opacity:1 !important; transform:none !important; margin-bottom:32px; page-break-inside:avoid; }
    body{ background:#fff; }
    .contact-card{ background:#fff; color:var(--ink); border:1px solid var(--line); }
    .contact-card h2, .contact-card p{ color:var(--ink); }
    .contact-links a{ color:var(--ink); border-bottom-color:var(--line); }
    .domain-slot{ display:none; }
  }
</style>

    <footer id="site-footer"></footer>

    text: "Estou aberto a novas oportunidades em operações, atendimento ao cliente, coordenação de equipes e ambientes internacionais.",
    domain: "Domínio próprio — em breve",
    linkedinLabel: "linkedin.com/in/bruno-almeida-manetta",
    cvLabel: "Baixar CV (PDF) ↓"
  },
  footer: "Última atualização · Julho de 2026"
}

};

/* =========================================================
   CONSTANTS (do not change with language)
   ========================================================= */
const EMAIL = "brunomanetta7@gmail.com";
const PHONE_DISPLAY = "+34 628 553 039";
const PHONE_HREF = "tel:+34628553039";
const LINKEDIN_URL = "https://www.linkedin.com/in/bruno-almeida-manetta-374550b4/";
const CV_HREF_BY_LANG = {
  es: "cv-bruno-manetta-es.pdf",
  en: "cv-bruno-manetta-en.pdf",
  pt: "cv-bruno-manetta-pt.pdf"
};

/* =========================================================
   RENDER ENGINE
   ========================================================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setMeta(name, content, isProperty){
  var sel = isProperty ? 'meta[property="'+name+'"]' : 'meta[name="'+name+'"]';
  var el = document.querySelector(sel);
  if(el) el.setAttribute('content', content);
}

function setText(id, value){
  document.getElementById(id).textContent = value;
}

function setHTML(id, value){
  document.getElementById(id).innerHTML = value;
}

function renderTags(tags, alt){
  return tags.map(function(tag){
    return '<span class="tag'+(alt?' alt':'')+'">'+esc(tag)+'</span>';
  }).join('');
}

let spyObserver = null;
let revealObserver = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderEntry(entry){
  var html = '<div class="entry">';
  html += '<div class="entry-idx">'+esc(entry.idx[0])+' —<br>'+esc(entry.idx[1])+'</div>';
  html += '<div>';
  html += '<h3 class="entry-title">'+esc(entry.title)+'</h3>';
  html += '<div class="entry-meta">'+esc(entry.meta)+'</div>';
  if(entry.context){
    html += '<p class="entry-context">'+esc(entry.context)+'</p>';
  }
  if(entry.subs){
    entry.subs.forEach(function(sub){
      html += '<div class="sub">';
      html += '<div class="sub-title">'+esc(sub.title)+'</div>';
      html += '<div class="sub-meta">'+esc(sub.meta)+'</div>';
      sub.blocks.forEach(function(block){
        html += '<div class="entry-block-label">'+esc(block.label)+'</div><ul>';
        block.items.forEach(function(item){ html += '<li>'+esc(item)+'</li>'; });
        html += '</ul>';
      });
      html += '</div>';
    });
  }
  if(entry.items){
    html += '<ul>';
    entry.items.forEach(function(it){
      html += '<li><strong>'+esc(it.label)+':</strong> '+esc(it.text)+'</li>';
    });
    html += '</ul>';
  }
  html += '</div></div>';
  return html;
}

function renderCompactEntry(entry){
  return '<div class="entry-compact">'+
    '<div class="entry-idx">'+esc(entry.idx[0])+' —<br>'+esc(entry.idx[1])+'</div>'+
    '<div>'+
      '<div class="compact-head">'+
        '<span class="compact-title">'+esc(entry.title)+'</span>'+
        '<span class="compact-meta">'+esc(entry.meta)+'</span>'+
      '</div>'+
      (entry.context ? '<p class="compact-context">'+esc(entry.context)+'</p>' : '')+
    '</div>'+
  '</div>';
}

function renderExperienceList(entries, earlyLabel){
  var html = '';
  var labelInserted = false;
  entries.forEach(function(entry){
    if(entry.compact && !labelInserted){
      html += '<div class="entry-group-label">'+esc(earlyLabel)+'</div>';
      labelInserted = true;
    }
    html += entry.compact ? renderCompactEntry(entry) : renderEntry(entry);
  });
  return html;
}

function renderHighlight(item, i){
  return '<div class="highlight-item">'+
    '<div class="highlight-idx mono">'+String(i+1).padStart(2,'0')+'</div>'+
    '<div class="highlight-label">'+esc(item.label)+'</div>'+
    '<div class="highlight-text">'+esc(item.text)+'</div>'+
  '</div>';
}

function renderProjectCard(c){
  return '<div class="project-card">'+
    '<div class="project-title">'+esc(c.title)+'</div>'+
    '<div class="case-block"><div class="case-label">'+esc(c.caseLabels.context)+'</div><div class="case-text">'+esc(c.context)+'</div></div>'+
    '<div class="case-block"><div class="case-label">'+esc(c.caseLabels.action)+'</div><div class="case-text">'+esc(c.action)+'</div></div>'+
    '<div class="case-block"><div class="case-label">'+esc(c.caseLabels.result)+'</div><div class="case-text">'+esc(c.result)+'</div></div>'+
  '</div>';
}

function render(lang){
  const t = T[lang];

  document.documentElement.lang = t.meta.htmlLang;
  document.title = t.meta.title;
  setMeta('description', t.meta.description);
  setMeta('og:title', t.meta.title, true);
  setMeta('og:description', t.meta.description, true);
  setMeta('og:locale', t.meta.ogLocale, true);
  document.querySelector('.skip-link').textContent = t.skipLink;

  setText('brand-sub', t.brandSub);
  setText('status-text', t.status);

  setHTML('nav-list', t.nav.map(function(item, i){
    return '<li><a href="#'+item.id+'" class="'+(i===0?'active':'')+'"><span class="idx mono">'+String(i+1).padStart(2,'0')+'</span>'+esc(item.label)+'</a></li>';
  }).join(''));

  setText('hero-role', t.hero.role);
  setHTML('hero-fields', t.hero.fields.map(function(f){
    return '<div class="field"><div class="field-label">'+esc(f.label)+'</div><div class="field-value">'+esc(f.value)+'</div></div>';
  }).join(''));
  setText('hero-lede', t.hero.lede);
  setHTML('hero-actions',
    '<a class="btn btn-primary" href="mailto:'+EMAIL+'">'+esc(t.hero.actions.contact)+'</a>'+
    '<a class="btn btn-secondary" href="'+LINKEDIN_URL+'" target="_blank" rel="noopener">'+esc(t.hero.actions.linkedin)+'</a>'+
    '<a class="btn btn-secondary" href="'+CV_HREF_BY_LANG[lang]+'" target="_blank" rel="noopener">'+esc(t.hero.actions.cv)+'</a>'
  );

  setText('highlights-eyebrow', t.highlights.eyebrow);
  setText('highlights-h', t.highlights.title);
  setHTML('highlights-grid', t.highlights.items.map(renderHighlight).join(''));

  setText('exp-eyebrow', t.experience.eyebrow);
  setText('exp-title', t.experience.title);
  setHTML('exp-entries', renderExperienceList(t.experience.entries, t.experience.earlyLabel));

  setText('proj-eyebrow', t.projects.eyebrow);
  setText('proj-title', t.projects.title);
  setHTML('proj-grid',
    t.projects.cards.map(renderProjectCard).join('') +
    '<div class="project-card empty">'+esc(t.projects.emptySlot)+'</div>'
  );

  setText('skills-eyebrow', t.skills.eyebrow);
  setText('skills-title', t.skills.title);
  setHTML('skills-groups', t.skills.groups.map(function(g){
    return '<div><div class="skill-group-label">'+esc(g.label)+'</div><div class="tags">'+renderTags(g.tags, g.alt)+'</div></div>';
  }).join(''));

  setText('langs-eyebrow', t.languages.eyebrow);
  setText('idiomas-h', t.languages.title);
  setHTML('langs-list', t.languages.items.map(function(i){
    return '<div class="lang-row-item"><span class="lang-name">'+esc(i.name)+'</span><span class="lang-level">'+esc(i.level)+'</span></div>';
  }).join(''));

  setText('edu-eyebrow', t.education.eyebrow);
  setText('edu-title', t.education.title);
  setHTML('edu-grid', t.education.items.map(function(e){
    return '<div class="edu-item'+(e.priority?' priority':'')+'"><div class="edu-title">'+esc(e.title)+'</div><div class="edu-meta">'+esc(e.meta)+'</div></div>';
  }).join(''));

  setText('int-eyebrow', t.interests.eyebrow);
  setText('int-title', t.interests.title);
  setText('int-text', t.interests.text);
  setHTML('int-tags', renderTags(t.interests.tags, false));

  setText('contact-title', t.contact.title);
  setText('contact-text', t.contact.text);
  setText('contact-domain', t.contact.domain);
  setHTML('contact-links',
    '<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'+
    '<a href="'+PHONE_HREF+'">'+PHONE_DISPLAY+'</a>'+
    '<a href="'+LINKEDIN_URL+'" target="_blank" rel="noopener">'+esc(t.contact.linkedinLabel)+'</a>'+
    '<a href="'+CV_HREF_BY_LANG[lang]+'" target="_blank" rel="noopener">'+esc(t.contact.cvLabel)+'</a>'
  );

  setText('site-footer', t.footer);

  initScrollSpy();
}

function initScrollSpy(){
  var sections = document.querySelectorAll('main section[id]');
  var navLinks = document.querySelectorAll('nav a');

  if(spyObserver) spyObserver.disconnect();
  spyObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        navLinks.forEach(function(link){
          link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
        });
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
  sections.forEach(function(s){ spyObserver.observe(s); });

  if(!revealObserver){
    if(reduceMotion){
      sections.forEach(function(s){ s.classList.add('visible'); });
    } else {
      revealObserver = new IntersectionObserver(function(entries, obs){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });
      sections.forEach(function(s){ revealObserver.observe(s); });
    }
  }
}

function setLang(lang){
  render(lang);
  document.querySelectorAll('.lang-switch button').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
}

document.querySelectorAll('.lang-switch button').forEach(function(btn){
  btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-lang')); });
});

setLang('es');
</script>
